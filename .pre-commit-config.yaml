# Pre-commit hooks для Fayna Odoo 17 module.
# Install: pre-commit install (один раз per clone)
# Run manually: pre-commit run --all-files
# CI: runs у .github/workflows/ci.yml (Phase 0 GitHub Actions setup)

repos:
  # Astral ruff — lint + format (replaces flake8 + isort + black + pyupgrade)
  # Pinned to match the ruff version used in dev (v0.6.9 predates rule S704).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # OCA Odoo-specific hooks (manifest validation, po files, copyright headers)
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.1.0
    hooks:
      - id: oca-checks-odoo-module
      - id: oca-checks-po

  # Security: secret scanner
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Security: Python code linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-ll, -r, --skip, B324, .]  # --skip B324: MD5 для Zadarma API signatures
        exclude: ^tests/

  # Types (scoped to lib/ — a framework-independent, fully-typed module;
  # Odoo's dynamic ORM has no first-party stubs, so models/controllers
  # are not included here).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # --explicit-package-bases: the repo root is an Odoo module dir with
        # a hyphen in its name (invalid Python package identifier) — this
        # flag stops mypy from trying to infer a dotted package name from it.
        args: [--ignore-missing-imports, --explicit-package-bases]
        files: ^lib/

  # Fayna policy: no AI co-author signature (content + commit message)
  - repo: local
    hooks:
      - id: no-ai-signature
        name: No AI co-author signature (file content)
        entry: python3 scripts/check_no_ai_signature.py
        language: system
        pass_filenames: true
        exclude: ^scripts/check_no_ai_signature\.py$
      - id: no-ai-signature-msg
        name: No AI co-author signature (commit message)
        entry: python3 scripts/check_no_ai_signature.py
        language: system
        stages: [commit-msg]

  # YAML / JSON / whitespace / merge conflicts
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]
